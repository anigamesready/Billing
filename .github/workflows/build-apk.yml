name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Ani Games Billing APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select newest Android source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*GITHUB-BUILD*.zip' -print | sort -V | tail -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No Android source ZIP found in repository root."
            exit 1
          fi
          VERSION="$(basename "$ZIP_FILE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)"
          if [ -z "$VERSION" ]; then VERSION="custom"; fi
          echo "Selected source archive: $ZIP_FILE (version $VERSION)"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract and validate Android project and Supabase key
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$RUNNER_TEMP/anigames-android-project"
          mkdir -p "$PROJECT_DIR"
          unzip -q "${{ steps.source.outputs.zip_file }}" -d "$PROJECT_DIR"
          if [ ! -f "$PROJECT_DIR/android/settings.gradle" ] || [ ! -f "$PROJECT_DIR/android/app/build.gradle" ]; then
            echo "::error::ZIP extracted, but android/settings.gradle or android/app/build.gradle is missing."
            find "$PROJECT_DIR" -maxdepth 5 -type f | head -100
            exit 1
          fi
          if grep -R -n 'sb_publishable_1Jsp3ZQDLwtozZ2hSPO83YA_7e1j723g' "$PROJECT_DIR/android/app/src/main/assets/web"; then
            echo "::error::Source ZIP still contains the rejected Supabase publishable key. Upload the v11.29.1 APIKEY-FIX ZIP."
            exit 1
          fi
          if ! grep -R -q 'sb_publishable_DobdCrOd43-vluON5gV7hg_6Js2Ea5V' "$PROJECT_DIR/android/app/src/main/assets/web"; then
            echo "::error::Expected Web-master Supabase publishable key not found in Android web assets."
            exit 1
          fi
          echo "Supabase key validation passed; no rejected v11.29.0 key found."
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR/android" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35 packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "$ANDROID_PROJECT_DIR" assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/apk-output/Ani-Games-Billing-${{ steps.source.outputs.version }}-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/apk-output/"*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ani-Games-Billing-Android-${{ steps.source.outputs.version }}-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
